[project]
name = "drafter"
version = "0.1.0"
description = "LaTeX論文執筆環境とPythonユーティリティ群。AIエージェントとの連携機能を将来的に提供予定。"
requires-python = ">=3.12"
dependencies = [
    "python-pptx>=1.0.2",
    "openai>=1.0.0",
    "pyyaml>=6.0",
    "click>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
dev-dependencies = [
    "mypy>=1.20.0",
    "types-pyyaml>=6.0.12.20260408",
]

[tool.mypy]
strict = true
packages = ["drafter"]
explicit_package_bases = true
mypy_path = "src"

[tool.ruff]
line-length = 100
target-version = "py311"
