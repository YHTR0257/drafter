section: introduction
required: true

meta:
  structure: funnel
  description: >
    広い話題から狭い仮説・検証へと絞り込む砂時計構造で構成する。
    各要素は上から順に具体性が増していくこと。

elements:
  - id: theme
    order: 1
    name: 大テーマの提示
    description: >
      研究分野と背景を短く提示し、読者との共通前提を作る。
      対象領域が何であり、なぜ重要かを簡潔に述べる。
    example: >
      ○○合金系の機械特性向上は構造材料設計における中心的課題であり、
      組成制御による特性最適化が広く研究されている。

  - id: issue
    order: 2
    name: 課題の明示
    description: >
      解くべき具体的な知識ギャップを明示する。
      既存研究で未解決または不十分な点を特定する。
    example: >
      しかし、特定の添加元素が複数の特性に与える交互作用については
      統一的な理解が得られていない。

  - id: why
    order: 3
    name: 取り組む意義
    description: >
      課題解決の意義を示し、研究の必要性を説得する。
      学術的・産業的な波及効果に言及する。
    example: >
      この課題の解明は、材料開発における試行錯誤の削減と
      設計指針の確立に直結する。

  - id: how
    order: 4
    name: 着眼点・仮説
    description: >
      既存研究との差分となる観点・仮説を示す。
      本研究独自のアプローチが何であるかを明確にする。
    example: >
      本研究では、組成と組織と特性の三者関係を同時に評価する
      という着眼点を採用する。

  - id: method
    order: 5
    name: 検証方法の概要
    description: >
      仮説検証のための方法と対象を簡潔に述べる。
      詳細はMethodセクションに委ね、ここでは概要のみとする。
    example: >
      複数条件の試料作製と組織観察・機械試験を組み合わせ、
      添加元素ごとの寄与を定量的に検証する。
