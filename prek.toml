# 汎用ファイルチェック
[[repos]]
repo = "https://github.com/pre-commit/pre-commit-hooks"
rev = "v6.0.0"
hooks = [
  { id = "check-yaml", exclude = "^(uv\\.lock|prek\\.toml|CLAUDE\\.md)$" },
  { id = "check-toml", exclude = "^(uv\\.lock|prek\\.toml|CLAUDE\\.md)$" },
  { id = "end-of-file-fixer", exclude = "^(uv\\.lock|prek\\.toml|CLAUDE\\.md)$" },
  { id = "trailing-whitespace", exclude = "^(uv\\.lock|prek\\.toml|CLAUDE\\.md)$" },
]

# Python lint + format
[[repos]]
repo = "https://github.com/astral-sh/ruff-pre-commit"
rev = "v0.15.0"
hooks = [
  { id = "ruff-check", args = ["--fix"], exclude = "^(uv\\.lock|prek\\.toml|CLAUDE\\.md)$" },
  { id = "ruff-format", exclude = "^(uv\\.lock|prek\\.toml|CLAUDE\\.md)$" },
]

# Python type check
[[repos]]
repo = "https://github.com/pre-commit/mirrors-mypy"
rev = "v1.16.0"
hooks = [
  { id = "mypy", exclude = "^(uv\\.lock|prek\\.toml|CLAUDE\\.md)$", additional_dependencies = ["pyyaml", "types-PyYAML", "openai<2", "click"] },
]

# 行長チェック
[[repos]]
repo = "https://github.com/editorconfig-checker/editorconfig-checker.python"
rev = "3.2.1"
hooks = [
  { id = "editorconfig-checker", alias = "ec", exclude = "^(uv\\.lock|prek\\.toml|CLAUDE\\.md)$" },
]

# ファイルタイプ禁止
[[repos]]
repo = "local"
hooks = [
  { id = "forbid-png-pdf-tex", name = "Forbid .png, .pdf and .tex files", entry = "bash -c 'echo \"Error: .png/.pdf/.tex files should not be committed\" >&2; exit 1'", language = "system", files = "\\.(png|pdf|tex)$", pass_filenames = false, exclude = "^(uv\\.lock|prek\\.toml)$" },
]
