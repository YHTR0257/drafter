section: abstract
required: false

meta:
  structure: funnel
  description: >
    背景から結論へ短く絞り込む要約構造で構成する。
    各要素は上から順に、課題提示、目的、方法、主要結果、結論へ進むこと。

elements:
  - id: background
    order: 1
    name: 背景・課題
    description: >
      研究対象領域と未解決課題を1文で簡潔に示す。
      読者が研究の出発点をすぐ把握できるようにする。
    example: >
      ○○分野では性能向上が求められているが、△△の制御方法には未解決の課題が残っている。

  - id: purpose
    order: 2
    name: 目的
    description: >
      本研究で何を明らかにするかを1文で明示する。
      研究の到達点を具体的に定義する。
    example: >
      本研究では、△△条件が□□特性に与える影響を明らかにすることを目的とした。

  - id: method
    order: 3
    name: 方法
    description: >
      対象、手法、設計の要点を1-2文で示す。
      詳細説明ではなく、研究の骨格が分かる程度にまとめる。
    example: >
      ○○試料を作製し、□□解析と△△試験を組み合わせて評価した。
      さらに、条件差による変化を比較する実験設計を採用した。

  - id: result
    order: 4
    name: 主要結果
    description: >
      主要な発見と定量結果を1-2文で示す。
      研究の核心となる結果を優先し、数値がある場合は明記する。
    example: >
      その結果、□□特性は従来比で約20%向上した。
      この向上は、△△の抑制と対応していた。

  - id: conclusion
    order: 5
    name: 結論・示唆
    description: >
      何が言えるかと、どこに効くかを1文でまとめる。
      結果の意義を簡潔に示し、応用可能性へつなげる。
    example: >
      以上より、△△制御は□□特性の改善に有効であり、○○設計への応用が期待される。
