section: discussion
required: true

meta:
  structure: argument
  description: >
    結果の意味づけから限界と今後の課題へと展開する議論構造で構成する。
    各要素は上から順に、研究課題への回答、解釈、背景、限界、次の問いへと進むこと。

elements:
  - id: answer
    order: 1
    name: 研究課題への回答
    description: >
      目的に対して何が言えるかを命題として明示する。
      目的文に対応した結論を、まず最初に示す。
    example: >
      以上より、○○条件では△△が有意に向上し、目的である特性改善は達成されたといえる。

  - id: interpretation
    order: 2
    name: 結果の解釈
    description: >
      なぜその結果が得られたのかを、データに基づく論理で説明する。
      観察結果と解釈の対応関係を明確にする。
    example: >
      この改善は、組織の均一化によって局所的な応力集中が緩和されたためと解釈できる。

  - id: background
    order: 3
    name: 背景・要因
    description: >
      成立メカニズムや条件を補足し、結果を支える要因を整理する。
      Why so? に答える補助説明として位置づける。
    example: >
      これは、添加元素が拡散挙動を抑制し、相分離の進行を遅らせたことと整合的である。

  - id: limitation
    order: 4
    name: 限界・欠点
    description: >
      研究の制約と一般化可能性の範囲を明示する。
      過大主張を避け、結果の適用条件を適切に示す。
    example: >
      ただし、本研究は限定した条件での検討であり、全ての材料系に一般化できるとは限らない。

  - id: future
    order: 5
    name: 新たな課題
    description: >
      次に検証すべき問いを提示し、議論を将来の検討へつなげる。
      So what? に接続する形で研究の発展可能性を示す。
    example: >
      今後は、温度条件や長期安定性の影響を検証し、適用範囲の拡張可能性を確認する必要がある。
