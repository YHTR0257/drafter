section: result
required: true

meta:
  structure: report
  description: >
    解析対象の確定から主要結果、補助結果、図表対応へと整理する報告構造で構成する。
    各要素は上から順に、解析対象、主要結果、補助結果、図表との対応へ進むこと。

elements:
  - id: sample
    order: 1
    name: 解析対象の記述
    description: >
      最終解析に何件を含めたかを明示する。
      サンプル数と除外数をセットで示し、解析対象の確定過程が分かるようにする。
    example: >
      収集した120件のうち、欠損値を含む8件を除外し、最終的に112件を解析対象とした。

  - id: main_results
    order: 2
    name: 主要結果の提示
    description: >
      目的に対応した主要指標の値を示す。
      目的や仮説と1対1で対応する形で、最も重要な結果を優先して記述する。
    example: >
      提案法は従来法に比べて精度が12%向上し、主要仮説を支持した。

  - id: supplementary
    order: 3
    name: 補助結果の提示
    description: >
      頑健性確認やサブ解析など、主結果を補強する結果を示す。
      主結果と区別し、必要に応じて条件差や追加検証を簡潔に述べる。
    example: >
      感度分析でも傾向は維持され、サブ群解析でも同様の改善が確認された。

  - id: figures_tables
    order: 4
    name: 図表との対応
    description: >
      本文の記述と図表番号を対応づける。
      参照漏れや重複説明を避け、どの結果がどの図表に対応するかを明確にする。
    example: >
      主要結果は図2、補助解析は表3に示す。
