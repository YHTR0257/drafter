# 汎用ファイルチェック
[[repos]]
repo = "https://github.com/pre-commit/pre-commit-hooks"
rev = "v6.0.0"
hooks = [
  { id = "check-yaml" },
  { id = "check-toml" },
  { id = "end-of-file-fixer" },
  { id = "trailing-whitespace" },
]

# Python lint + format
[[repos]]
repo = "https://github.com/astral-sh/ruff-pre-commit"
rev = "v0.15.0"
hooks = [
  { id = "ruff-check", args = ["--fix"] },
  { id = "ruff-format" },
]

# Python type check
[[repos]]
repo = "https://github.com/pre-commit/mirrors-mypy"
rev = "v1.16.0"
hooks = [
  { id = "mypy" },
]

# 行長チェック
[[repos]]
repo = "https://github.com/editorconfig-checker/editorconfig-checker.python"
rev = "3.2.1"
hooks = [
  { id = "editorconfig-checker", alias = "ec" },
]

# ファイルタイプ禁止
[[repos]]
repo = "local"
hooks = [
  { id = "forbid-png-pdf-tex",
    name = "Forbid .png, .pdf and .tex files",
    entry = "bash -c 'echo \"Error: .png/.pdf/.tex files should not be committed\" >&2; exit 1'",
    language = "system", files = "\\.(png|pdf|tex)$", pass_filenames = false },
]
