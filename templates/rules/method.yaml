section: method
required: true

meta:
  structure: pipeline
  description: >
    収集から処理、解析へと順に積み上げる手順構造で構成する。
    各要素は上から順に、データ収集、データ処理、解析・検証へ進むこと。

elements:
  - id: input
    order: 1
    name: データ収集
    description: >
      何を、どこから、どう取得したかを明示する。
      対象、期間、条件、除外基準、サンプル数を最低限含める。
    example: >
      ○○地域の観測データを2019年から2023年まで収集し、条件を満たす△△件を解析対象とした。

  - id: transformation
    order: 2
    name: データ処理
    description: >
      生データをどのように整形したかを示す。
      前処理、欠損処理、外れ値処理、特徴量化の方針を簡潔にまとめる。
    example: >
      欠損値は中央値で補完し、外れ値は1.5IQRを基準に除外した。
      その後、各変数を標準化して特徴量を作成した。

  - id: inference
    order: 3
    name: 解析・検証
    description: >
      どう評価し、どう判断したかを示す。
      手法、評価指標、統計検定、有意水準、比較条件を最低限含める。
    example: >
      多変量回帰と交差検証により性能を評価し、群間差は有意水準5%で検定した。
      比較条件として従来法と提案法を用いた。
