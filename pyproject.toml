[project]
name = "drafter"
version = "0.1.0"
description = "LaTeX論文執筆環境とPythonユーティリティ群。AIエージェントとの連携機能を将来的に提供予定。"
requires-python = ">=3.12"
dependencies = [
    "python-pptx>=1.0.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
dev-dependencies = []

[tool.mypy]
strict = true
packages = ["drafter"]

[tool.ruff]
line-length = 100
target-version = "py311"
